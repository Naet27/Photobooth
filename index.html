<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haru Studio - Korean Photobooth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&family=Sriracha&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        mali: ['Mali', 'cursive'],
                        cute: ['Sriracha', 'cursive']
                    },
                    colors: {
                        haru: {
                            pink: '#FFD6E0',
                            lavender: '#E8DFF5',
                            cream: '#FFF1E6',
                            mint: '#D8F3DC',
                            blue: '#D6E2E9',
                            dark: '#2B2D42'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Prompt', 'Mali', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #E6E6FA 100%);
            min-height: 100vh;
        }

        /* Camera Realtime CSS Filters */
        .filter-korean { filter: brightness(1.08) contrast(1.02) saturate(1.12) hue-rotate(-3deg); }
        .filter-peach { filter: brightness(1.06) saturate(1.22) sepia(0.08) hue-rotate(-12deg); }
        .filter-vintage { filter: sepia(0.3) contrast(1.08) brightness(0.98); }
        .filter-warm { filter: sepia(0.18) saturate(1.25) brightness(1.04); }
        .filter-bw { filter: grayscale(100%) contrast(1.15); }
        .filter-none { filter: none; }

        /* Frame Theme Styles */
        .theme-pink-ribbon { background-color: #FFB6C1; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.4), rgba(255,255,255,0.4) 12px, transparent 12px, transparent 24px); }
        .theme-clean-white { background-color: #FFFFFF; border: 1px solid #E5E7EB; }
        .theme-pastel-cloud { background: linear-gradient(180deg, #E0C3FC 0%, #8EC5FC 100%); }
        .theme-retro-film { background-color: #262626; border: 2px solid #E5E7EB; }
        .theme-cute-cats { background-color: #FEF3C7; background-image: radial-gradient(#F59E0B 18%, transparent 19%); background-size: 16px 16px; }
        .theme-sweet-hearts { background-color: #FCA5A5; background-image: repeating-radial-gradient(circle at 0 0, transparent 0, #FCA5A5 10px, transparent 20px); }
        .theme-flower-blossom { background-color: #D1FAE5; background-image: radial-gradient(#34D399 15%, transparent 16%); background-size: 18px 18px; }
        .theme-birthday { background: linear-gradient(135deg, #FFD1DC 0%, #FFF5CD 100%); }
        .theme-milk-tea { background-color: #E5D0AC; }
        .theme-soft-lavender { background: linear-gradient(135deg, #E8DFF5 0%, #F31B7D 100%); background-color: #E8DFF5; }
        .theme-minimal-black { background-color: #111827; }

        /* Shutter Button Soft Pulse Animation */
        @keyframes softPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(244, 114, 182, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 114, 182, 0); }
        }
        .shutter-btn-anim { animation: softPulse 2s infinite ease-in-out; }

        /* Camera Flash Overlay Animation */
        @keyframes flashAnim {
            0% { opacity: 0; }
            50% { opacity: 0.95; }
            100% { opacity: 0; }
        }
        .flash-overlay-active { animation: flashAnim 0.35s ease-out; }

        /* Sticker Drag Mechanics */
        .sticker-item { user-select: none; touch-action: none; cursor: grab; }
        .sticker-item:active { cursor: grabbing; }
    </style>
</head>
<body class="text-gray-800 antialiased pb-12">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-pink-100 shadow-2xs">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-pink-300 to-purple-300 flex items-center justify-center text-pink-600 shadow-xs">
                    <i class="fa-solid fa-camera text-lg"></i>
                </div>
                <div>
                    <h1 class="font-mali text-base sm:text-lg font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                        Photo Camera
                    </h1>
                    <p class="text-[10px] text-gray-400 font-mali">ถ่ายรูปโฟโต้บูส</p>
                </div>
            </div>
            <button onclick="resetApp()" class="px-3 py-1.5 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-full transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-rotate-left text-pink-400"></i> เริ่มใหม่
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-4 mt-6">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- LEFT COLUMN: CAMERA VIEWFINDER & CIRCULAR SHUTTER BUTTON -->
            <div class="lg:col-span-7 space-y-4">
                
                <!-- Main Camera Card -->
                <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-pink-100 relative">
                    
                    <!-- Live Camera Screen (Aspect Ratio Fixed) -->
                    <div class="relative w-full aspect-[4/3] bg-gray-100 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border border-gray-200">
                        
                        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100 filter-korean transition-all duration-300"></video>
                        <canvas id="captureCanvas" class="hidden"></canvas>
                        
                        <!-- Flash Overlay -->
                        <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-30"></div>

                        <!-- Countdown Screen -->
                        <div id="countdownOverlay" class="absolute inset-0 bg-black/40 backdrop-blur-xs hidden flex-col items-center justify-center text-white z-20">
                            <span id="countdownNumber" class="font-mali text-7xl font-bold text-pink-200 animate-bounce">3</span>
                            <span class="text-xs font-semibold mt-2 bg-pink-400/90 backdrop-blur-md px-4 py-1.5 rounded-full font-mali">ยิ้มหวานๆหน่อยจ้าาาา</span>
                        </div>

                        <!-- Camera Offline / Permission Prompt -->
                        <div id="cameraPrompt" class="absolute inset-0 bg-pink-50/95 flex flex-col items-center justify-center p-6 text-center z-10">
                            <div class="w-12 h-12 rounded-full bg-pink-200 flex items-center justify-center text-pink-500 text-xl mb-3">
                                <i class="fa-solid fa-video"></i>
                            </div>
                            <h3 class="font-bold text-gray-700 text-sm">เปิดใช้งานกล้องถ่ายรูป</h3>
                            <p class="text-xs text-gray-400 font-mali my-2">กดปุ่มเพื่ออนุญาตให้เข้าถึงกล้อง หรืออัปโหลดรูปภาพ</p>
                            <div class="flex flex-wrap gap-2 justify-center mt-1">
                                <button onclick="initCamera()" class="bg-pink-400 hover:bg-pink-500 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-xs transition cursor-pointer">
                                    <i class="fa-solid fa-power-off"></i> เปิดกล้อง
                                </button>
                                <label class="bg-purple-400 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-xs transition cursor-pointer flex items-center gap-1">
                                    <i class="fa-solid fa-upload"></i> อัปโหลดรูป
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadImageFallback(event)">
                                </label>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div class="absolute top-3 left-3 bg-white/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-gray-600 border border-white/40 shadow-xs flex items-center gap-1.5 z-10">
                            <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
                            <span>รูปที่ <span id="photoBadgeCount" class="text-pink-500">0</span> / <span id="photoBadgeTotal" class="text-pink-500">4</span></span>
                        </div>

                        <!-- Screen Toggle Controls -->
                        <div class="absolute top-3 right-3 flex items-center gap-1.5 bg-white/80 backdrop-blur-md p-1 rounded-xl border border-white/40 shadow-xs z-10">
                            <button onclick="toggleMirror()" title="ส่องกระจก" class="w-7 h-7 hover:bg-pink-100 text-gray-600 rounded-lg text-xs flex items-center justify-center transition cursor-pointer">
                                <i class="fa-solid fa-right-left"></i>
                            </button>
                            <button onclick="switchCameraFacing()" title="สลับกล้อง" class="w-7 h-7 hover:bg-pink-100 text-gray-600 rounded-lg text-xs flex items-center justify-center transition cursor-pointer">
                                <i class="fa-solid fa-camera-rotate"></i>
                            </button>
                        </div>

                    </div>

                    <!-- Quick Toolbar (Filter & Timer) -->
                    <div class="flex items-center justify-between gap-2 mt-4 pt-3 border-t border-gray-100 text-xs">
                        <!-- Filter Selector -->
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-500 text-xs"><i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> ฟิลเตอร์:</span>
                            <select id="filterSelect" onchange="applyFilter(this.value)" class="bg-gray-50 border border-gray-200 text-gray-700 rounded-xl px-2.5 py-1 text-xs font-bold focus:outline-none focus:ring-1 focus:ring-pink-300">
                                <option value="filter-korean">Korean Glow</option>
                                <option value="filter-peach">Soft Peach</option>
                                <option value="filter-none">Natural</option>
                                <option value="filter-vintage">Vintage</option>
                                <option value="filter-warm">Warm Sunset</option>
                                <option value="filter-bw">B&W</option>
                            </select>
                        </div>

                        <!-- Timer Selector -->
                        <div class="flex items-center gap-1 bg-gray-50 p-1 rounded-xl border border-gray-200">
                            <span class="text-[11px] font-bold text-gray-400 px-1">จับเวลา:</span>
                            <button onclick="setTimer(3)" id="timerBtn-3" class="timer-btn px-2 py-0.5 rounded-lg text-xs font-bold bg-pink-400 text-white cursor-pointer">3s</button>
                            <button onclick="setTimer(5)" id="timerBtn-5" class="timer-btn px-2 py-0.5 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-800 cursor-pointer">5s</button>
                            <button onclick="setTimer(10)" id="timerBtn-10" class="timer-btn px-2 py-0.5 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-800 cursor-pointer">10s</button>
                        </div>
                    </div>

                    <!-- CIRCULAR CAMERA SHUTTER BUTTON -->
                    <div class="flex flex-col items-center justify-center mt-5">
                        <button id="startCaptureBtn" onclick="startPhotoSequence()" class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white rounded-full shadow-lg border-4 border-pink-100 flex items-center justify-center transition active:scale-90 shutter-btn-anim cursor-pointer">
                            <i class="fa-solid fa-camera text-2xl sm:text-3xl"></i>
                        </button>
                        <span class="text-xs font-bold text-pink-500 font-mali mt-2">ถ่ายรูป</span>
                    </div>

                </div>

                <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-pink-100 space-y-4">
                    
                    <!-- 1. Layout Chooser -->
                    <div>
                        <h3 class="font-bold text-xs sm:text-sm text-gray-700 mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-border-all text-pink-400"></i> 1. เลือกกรอบ
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="setLayout('4-strip')" id="layoutBtn-4-strip" class="layout-btn p-2 rounded-2xl border-2 border-pink-400 bg-pink-50 flex flex-col items-center gap-1 transition cursor-pointer">
                                <div class="w-5 h-8 border border-pink-300 rounded bg-white p-0.5 flex flex-col gap-0.5"><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div></div>
                                <span class="text-[10px] font-bold text-gray-700">4-Strip</span>
                            </button>
                            <button onclick="setLayout('2x2')" id="layoutBtn-2x2" class="layout-btn p-2 rounded-2xl border border-gray-200 hover:border-pink-300 flex flex-col items-center gap-1 transition cursor-pointer">
                                <div class="w-7 h-7 border border-pink-300 rounded bg-white p-0.5 grid grid-cols-2 gap-0.5"><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div></div>
                                <span class="text-[10px] font-bold text-gray-700">ตาราง 2x2</span>
                            </button>
                            <button onclick="setLayout('3-vert')" id="layoutBtn-3-vert" class="layout-btn p-2 rounded-2xl border border-gray-200 hover:border-pink-300 flex flex-col items-center gap-1 transition cursor-pointer">
                                <div class="w-5 h-8 border border-pink-300 rounded bg-white p-0.5 flex flex-col gap-0.5"><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div><div class="bg-pink-300 h-full rounded-2xs"></div></div>
                                <span class="text-[10px] font-bold text-gray-700">3 ช่อง</span>
                            </button>
                            <button onclick="setLayout('polaroid')" id="layoutBtn-polaroid" class="layout-btn p-2 rounded-2xl border border-gray-200 hover:border-pink-300 flex flex-col items-center gap-1 transition cursor-pointer">
                                <div class="w-7 h-7 border border-pink-300 rounded bg-white p-0.5 flex flex-col justify-between pb-1"><div class="bg-pink-300 w-full h-4 rounded-2xs"></div></div>
                                <span class="text-[10px] font-bold text-gray-700">โพลารอยด์</span>
                            </button>
                        </div>
                    </div>

                    <!-- 2. Themes Palette including Clean White -->
                    <div>
                        <h3 class="font-bold text-xs sm:text-sm text-gray-700 mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-palette text-pink-400"></i> 2. เลือกลายกรอบรูปน่ารัก
                        </h3>
                        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
                            <button onclick="applyTheme('clean-white')" class="p-2 bg-white border border-gray-300 rounded-xl text-center hover:scale-95 transition shadow-2xs cursor-pointer"><span class="text-[11px] font-bold text-gray-800">Clean White</span></button>
                            <button onclick="applyTheme('pink-ribbon')" class="p-2 bg-pink-100 border border-pink-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-pink-700">Bow Pink</span></button>
                            <button onclick="applyTheme('pastel-cloud')" class="p-2 bg-blue-100 border border-blue-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-blue-700">Cloud</span></button>
                            <button onclick="applyTheme('sweet-hearts')" class="p-2 bg-red-100 border border-red-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-red-700">Hearts</span></button>
                            <button onclick="applyTheme('cute-cats')" class="p-2 bg-yellow-100 border border-yellow-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-yellow-800"> Cute Cat</span></button>
                            <button onclick="applyTheme('flower-blossom')" class="p-2 bg-emerald-100 border border-emerald-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-emerald-700"> Flower</span></button>
                            <button onclick="applyTheme('birthday')" class="p-2 bg-rose-100 border border-rose-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-rose-700">Birthday</span></button>
                            <button onclick="applyTheme('milk-tea')" class="p-2 bg-amber-100 border border-amber-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-amber-800">Milk Tea</span></button>
                            <button onclick="applyTheme('soft-lavender')" class="p-2 bg-purple-100 border border-purple-300 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-purple-700">Lavender</span></button>
                            <button onclick="applyTheme('retro-film')" class="p-2 bg-gray-800 border border-gray-600 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-yellow-300">Film</span></button>
                            <button onclick="applyTheme('minimal-black')" class="p-2 bg-black border border-gray-700 rounded-xl text-center hover:scale-95 transition cursor-pointer"><span class="text-[11px] font-bold text-white">Black</span></button>
                        </div>
                    </div>

                    <!-- 3. Captions and Stickers -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-gray-100">
                        <div>
                            <label class="text-xs font-bold text-gray-700 mb-1 block">3. ข้อความใต้รูป</label>
                            <input type="text" id="captionInput" oninput="updateCaption()" value="Photo Camera" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-1 focus:ring-pink-300">
                            <div class="flex items-center justify-between text-[11px] mt-1 text-gray-500">
                                <span>ประทับตราวันที่</span>
                                <input type="checkbox" id="showDateToggle" checked onchange="updateCaption()" class="accent-pink-400 w-3.5 h-3.5 rounded cursor-pointer">
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-gray-700">4. ตกเเต่งสติ๊กเกอร์</label>
                                <button onclick="clearStickers()" class="text-[10px] text-pink-500 font-bold hover:underline cursor-pointer">ล้างสติกเกอร์</button>
                            </div>
                            <div class="flex flex-wrap gap-1 bg-gray-50 p-1.5 rounded-xl border border-gray-100 text-base">
                                <button onclick="addSticker('🎀')" class="hover:scale-125 transition cursor-pointer">🎀</button>
                                <button onclick="addSticker('💖')" class="hover:scale-125 transition cursor-pointer">💖</button>
                                <button onclick="addSticker('✨')" class="hover:scale-125 transition cursor-pointer">✨</button>
                                <button onclick="addSticker('👑')" class="hover:scale-125 transition cursor-pointer">👑</button>
                                <button onclick="addSticker('🧸')" class="hover:scale-125 transition cursor-pointer">🧸</button>
                                <button onclick="addSticker('🌸')" class="hover:scale-125 transition cursor-pointer">🌸</button>
                                <button onclick="addSticker('🐱')" class="hover:scale-125 transition cursor-pointer">🐱</button>
                                <button onclick="addSticker('🍰')" class="hover:scale-125 transition cursor-pointer">🍰</button>
                                <button onclick="addSticker('⭐')" class="hover:scale-125 transition cursor-pointer">⭐</button>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- RIGHT COLUMN: LIVE PHOTO STRIP PREVIEW & EXPORT -->
            <div class="lg:col-span-5 flex flex-col items-center">
                
                <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-pink-100 w-full flex flex-col items-center">
                    
                    <div class="flex items-center justify-between w-full mb-3 pb-2 border-b border-gray-100">
                        <h3 class="font-bold text-xs sm:text-sm text-gray-700 flex items-center gap-1.5">
                            <i class="fa-solid fa-images text-pink-400"></i> รูปถ่ายของคุณ
                        </h3>
                        <span class="text-[10px] bg-pink-50 text-pink-500 px-2 py-0.5 rounded-full font-bold">PREVIEW</span>
                    </div>

                    <!-- REAL-TIME PHOTO STRIP FRAME -->
                    <div id="photoboothFrame" class="theme-pink-ribbon rounded-2xl p-3 shadow-md transition-all duration-300 relative select-none w-full max-w-[230px] sm:max-w-[250px] flex flex-col items-center border-4 border-white my-2">
                        
                        <!-- Photos Container Grid -->
                        <div id="framePhotosGrid" class="w-full grid gap-2 flex-grow z-10">
                            <!-- JS Injected Photo Slots -->
                        </div>

                        <!-- Caption Footer -->
                        <div class="w-full text-center mt-2.5 z-10">
                            <p id="frameCaptionDisplay" class="font-cute text-gray-800 text-sm font-bold leading-tight">Photo Camera</p>
                            <p id="frameDateDisplay" class="text-[9px] tracking-wider text-gray-600 font-bold uppercase mt-0.5">2026.09.25</p>
                        </div>

                        <!-- Sticker Overlays -->
                        <div id="stickersContainer" class="absolute inset-0 overflow-hidden pointer-events-none z-20">
                            <!-- JS Injected Stickers -->
                        </div>

                    </div>

                    <!-- Retake Controls & Export Buttons -->
                    <div class="w-full mt-4 pt-3 border-t border-gray-100 text-center space-y-3">
                        
                        <!-- Slot Retake Thumbnails -->
                        <div class="text-left">
                            <label class="text-[11px] font-bold text-gray-500 block mb-1">ถ่ายใหม่เฉพาะช่อง:</label>
                            <div id="slotsThumbnails" class="grid grid-cols-4 gap-1.5">
                                <!-- JS Injected Slot Retake Buttons -->
                            </div>
                        </div>

                        <!-- Export Buttons -->
                        <div class="flex flex-col sm:flex-row gap-2 pt-1">
                            <button onclick="downloadImage()" class="flex-1 py-2.5 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center justify-center gap-1.5 cursor-pointer">
                                <i class="fa-solid fa-download"></i> บันทึกรูปภาพ (PNG)
                            </button>
                            <button onclick="printPhoto()" class="flex-1 py-2.5 bg-purple-400 hover:bg-purple-500 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center justify-center gap-1.5 cursor-pointer">
                                <i class="fa-solid fa-print"></i> พิมพ์รูป (Print)
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2.5 rounded-2xl text-xs font-bold shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-sparkles text-pink-300"></i>
        <span id="toastMsg">ข้อความแจ้งเตือน</span>
    </div>

    <script>
        // Application State
        const state = {
            currentLayout: '4-strip',
            currentTheme: 'pink-ribbon',
            timerSeconds: 3,
            currentFilter: 'filter-korean',
            isMirrored: true,
            facingMode: 'user',
            stream: null,
            capturedPhotos: [],
            activeRetakeIndex: null,
            textColor: '#1F2937',
            stickers: []
        };

        const layoutConfigs = {
            '4-strip': { count: 4, gridClass: 'grid-cols-1', aspect: 'aspect-[4/3]' },
            '2x2': { count: 4, gridClass: 'grid-cols-2', aspect: 'aspect-[4/3]' },
            '3-vert': { count: 3, gridClass: 'grid-cols-1', aspect: 'aspect-[4/3]' },
            'polaroid': { count: 1, gridClass: 'grid-cols-1', aspect: 'aspect-[4/3]' }
        };

        const webcam = document.getElementById('webcam');
        const captureCanvas = document.getElementById('captureCanvas');

        // Initialize Camera
        async function initCamera() {
            try {
                if (state.stream) {
                    state.stream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: state.facingMode },
                    audio: false
                };
                state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = state.stream;
                document.getElementById('cameraPrompt').classList.add('hidden');
                showToast("เปิดกล้องสำเร็จ");
            } catch (err) {
                console.error("Camera Access Error:", err);
                document.getElementById('cameraPrompt').classList.remove('hidden');
                showToast("ไม่สามารถเข้าถึงกล้องได้");
            }
        }

        function switchCameraFacing() {
            state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }

        function toggleMirror() {
            state.isMirrored = !state.isMirrored;
            webcam.className = `w-full h-full object-cover transform ${state.isMirrored ? '-scale-x-100' : ''} ${state.currentFilter} transition-all duration-300`;
        }

        function applyFilter(filterClass) {
            state.currentFilter = filterClass;
            webcam.className = `w-full h-full object-cover transform ${state.isMirrored ? '-scale-x-100' : ''} ${filterClass} transition-all duration-300`;
        }

        function setTimer(sec) {
            state.timerSeconds = sec;
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.className = "timer-btn px-2 py-0.5 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-800 cursor-pointer";
            });
            document.getElementById(`timerBtn-${sec}`).className = "timer-btn px-2 py-0.5 rounded-lg text-xs font-bold bg-pink-400 text-white cursor-pointer";
        }

        function applyTheme(themeName) {
            state.currentTheme = themeName;
            const frame = document.getElementById('photoboothFrame');
            frame.className = `theme-${themeName} rounded-2xl p-3 shadow-md transition-all duration-300 relative select-none w-full max-w-[230px] sm:max-w-[250px] flex flex-col items-center border-4 border-white my-2`;

            const captionDisp = document.getElementById('frameCaptionDisplay');
            const dateDisp = document.getElementById('frameDateDisplay');

            if (['minimal-black', 'retro-film'].includes(themeName)) {
                captionDisp.style.color = '#FFFFFF';
                dateDisp.style.color = '#9CA3AF';
            } else if (themeName === 'clean-white') {
                captionDisp.style.color = '#1F2937';
                dateDisp.style.color = '#6B7280';
            } else {
                captionDisp.style.color = '#1F2937';
                dateDisp.style.color = '#4B5563';
            }
        }

        function setLayout(layoutType) {
            state.currentLayout = layoutType;
            state.capturedPhotos = [];
            
            document.querySelectorAll('.layout-btn').forEach(btn => {
                btn.className = "layout-btn p-2 rounded-2xl border border-gray-200 hover:border-pink-300 flex flex-col items-center gap-1 transition cursor-pointer";
            });
            const activeBtn = document.getElementById(`layoutBtn-${layoutType}`);
            if(activeBtn) activeBtn.className = "layout-btn p-2 rounded-2xl border-2 border-pink-400 bg-pink-50 flex flex-col items-center gap-1 transition cursor-pointer";

            renderFrameSlots();
            updatePhotoBadges();
        }

        function renderFrameSlots() {
            const grid = document.getElementById('framePhotosGrid');
            const config = layoutConfigs[state.currentLayout];
            
            grid.className = `w-full grid ${config.gridClass} gap-2 flex-grow z-10`;
            grid.innerHTML = '';

            for (let i = 0; i < config.count; i++) {
                const photoSrc = state.capturedPhotos[i];
                const slotDiv = document.createElement('div');
                slotDiv.className = `w-full ${config.aspect} bg-white/60 rounded-xl overflow-hidden border border-white/50 shadow-xs flex items-center justify-center relative group cursor-pointer`;
                
                if (photoSrc) {
                    slotDiv.innerHTML = `<img src="${photoSrc}" class="w-full h-full object-cover">
                    <div onclick="retakeSingleSlot(${i})" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center text-white text-xs font-bold gap-1">
                        <i class="fa-solid fa-camera-rotate text-base"></i>
                        <span>ถ่ายใหม่</span>
                    </div>`;
                } else {
                    slotDiv.innerHTML = `<div class="text-gray-300 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-image text-xl"></i>
                        <span class="text-[10px] font-bold">${i + 1}</span>
                    </div>`;
                }
                grid.appendChild(slotDiv);
            }
            renderThumbnails();
        }

        function renderThumbnails() {
            const container = document.getElementById('slotsThumbnails');
            const config = layoutConfigs[state.currentLayout];
            container.innerHTML = '';

            for (let i = 0; i < config.count; i++) {
                const photoSrc = state.capturedPhotos[i];
                const btn = document.createElement('button');
                btn.onclick = () => retakeSingleSlot(i);
                btn.className = `aspect-[4/3] rounded-lg border flex items-center justify-center overflow-hidden relative cursor-pointer ${photoSrc ? 'border-pink-400 bg-pink-50' : 'border-gray-200 bg-gray-100 text-gray-400'}`;
                
                if (photoSrc) {
                    btn.innerHTML = `<img src="${photoSrc}" class="w-full h-full object-cover">
                    <span class="absolute top-0.5 left-0.5 bg-black/60 text-white text-[8px] px-1 rounded font-bold">${i + 1}</span>`;
                } else {
                    btn.innerHTML = `<span class="text-xs font-bold">${i + 1}</span>`;
                }
                container.appendChild(btn);
            }
        }

        function updatePhotoBadges() {
            const config = layoutConfigs[state.currentLayout];
            document.getElementById('photoBadgeCount').innerText = state.capturedPhotos.length;
            document.getElementById('photoBadgeTotal').innerText = config.count;
        }

        // --- MANUAL PIXEL FILTER POLYFILL FOR IOS / SAFARI COMPATIBILITY ---
        function applyPixelFilter(ctx, width, height, filterType) {
            if (filterType === 'filter-none') return;

            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (filterType === 'filter-korean') {
                    // Brightness 1.08, Contrast 1.02, Saturate 1.12
                    r = Math.min(255, (r - 128) * 1.02 + 128 + 20);
                    g = Math.min(255, (g - 128) * 1.02 + 128 + 20);
                    b = Math.min(255, (b - 128) * 1.02 + 128 + 18);
                } else if (filterType === 'filter-peach') {
                    // Soft Pinkish Warmth
                    r = Math.min(255, r * 1.1 + 10);
                    g = Math.min(255, g * 1.02 + 5);
                    b = Math.min(255, b * 0.95);
                } else if (filterType === 'filter-vintage') {
                    // Sepia blend + contrast
                    let tr = 0.393 * r + 0.769 * g + 0.189 * b;
                    let tg = 0.349 * r + 0.686 * g + 0.168 * b;
                    let tb = 0.272 * r + 0.534 * g + 0.131 * b;
                    r = Math.min(255, r * 0.7 + tr * 0.3);
                    g = Math.min(255, g * 0.7 + tg * 0.3);
                    b = Math.min(255, b * 0.7 + tb * 0.3);
                } else if (filterType === 'filter-warm') {
                    // Warm Sunset
                    r = Math.min(255, r * 1.12 + 8);
                    g = Math.min(255, g * 1.05 + 4);
                    b = Math.min(255, b * 0.88);
                } else if (filterType === 'filter-bw') {
                    // High Contrast Grayscale
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    gray = (gray - 128) * 1.15 + 128;
                    r = g = b = Math.min(255, Math.max(0, gray));
                }

                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Capture Frame Function
        // บันทึกภาพให้มีสัดส่วนเดียวกับช่อง Preview (4:3)
        // ป้องกันภาพจากกล้อง 16:9 ถูกยืด/บีบตอนนำไปแสดงในกรอบ
        function capturePhotoFromCamera() {
            if (!webcam.videoWidth || !webcam.videoHeight) return null;

            const targetAspect = 4 / 3;
            const sourceAspect = webcam.videoWidth / webcam.videoHeight;

            let sx = 0;
            let sy = 0;
            let sw = webcam.videoWidth;
            let sh = webcam.videoHeight;

            // Crop ตรงกลางให้เป็น 4:3 แบบเดียวกับ object-cover
            if (sourceAspect > targetAspect) {
                // กล้องกว้างเกินไป เช่น 16:9 -> ตัดซ้าย/ขวา
                sw = Math.round(webcam.videoHeight * targetAspect);
                sx = Math.round((webcam.videoWidth - sw) / 2);
            } else if (sourceAspect < targetAspect) {
                // กล้องสูงเกินไป -> ตัดบน/ล่าง
                sh = Math.round(webcam.videoWidth / targetAspect);
                sy = Math.round((webcam.videoHeight - sh) / 2);
            }

            const outputWidth = sw;
            const outputHeight = Math.round(sw / targetAspect);

            captureCanvas.width = outputWidth;
            captureCanvas.height = outputHeight;

            const ctx = captureCanvas.getContext('2d', { willReadFrequently: true });

            ctx.save();

            // Mirror ให้ตรงกับ Preview
            if (state.isMirrored) {
                ctx.translate(outputWidth, 0);
                ctx.scale(-1, 1);
            }

            // วาดเฉพาะส่วน 4:3 ไม่ยืดภาพ
            ctx.drawImage(
                webcam,
                sx, sy, sw, sh,
                0, 0, outputWidth, outputHeight
            );

            ctx.restore();

            applyPixelFilter(ctx, outputWidth, outputHeight, state.currentFilter);

            triggerFlashAnimation();
            return captureCanvas.toDataURL('image/png');
        }

        function triggerFlashAnimation() {
            const flash = document.getElementById('flashOverlay');
            flash.classList.remove('flash-overlay-active');
            void flash.offsetWidth;
            flash.classList.add('flash-overlay-active');
        }

        async function startPhotoSequence() {
            const config = layoutConfigs[state.currentLayout];
            const btn = document.getElementById('startCaptureBtn');
            btn.disabled = true;

            if (state.activeRetakeIndex !== null) {
                await runCountdown();
                const photo = capturePhotoFromCamera();
                if (photo) {
                    state.capturedPhotos[state.activeRetakeIndex] = photo;
                }
                state.activeRetakeIndex = null;
            } else {
                state.capturedPhotos = [];
                for (let i = 0; i < config.count; i++) {
                    updatePhotoBadges();
                    await runCountdown();
                    const photo = capturePhotoFromCamera();
                    if (photo) {
                        state.capturedPhotos.push(photo);
                        renderFrameSlots();
                        updatePhotoBadges();
                    }
                }
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
            }

            btn.disabled = false;
            renderFrameSlots();
            updatePhotoBadges();
        }

        function retakeSingleSlot(index) {
            state.activeRetakeIndex = index;
            showToast(`เตรียมพร้อมถ่ายซ่อมช่องที่ ${index + 1}`);
            startPhotoSequence();
        }

        function runCountdown() {
            return new Promise((resolve) => {
                const overlay = document.getElementById('countdownOverlay');
                const numDisplay = document.getElementById('countdownNumber');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                let count = state.timerSeconds;
                numDisplay.innerText = count;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        numDisplay.innerText = count;
                    } else {
                        clearInterval(timer);
                        overlay.classList.add('hidden');
                        overlay.classList.remove('flex');
                        resolve();
                    }
                }, 1000);
            });
        }

        function uploadImageFallback(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    captureCanvas.width = img.width;
                    captureCanvas.height = img.height;
                    const ctx = captureCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    applyPixelFilter(ctx, captureCanvas.width, captureCanvas.height, state.currentFilter);

                    const photoData = captureCanvas.toDataURL('image/png');
                    const config = layoutConfigs[state.currentLayout];

                    if (state.capturedPhotos.length < config.count) {
                        state.capturedPhotos.push(photoData);
                    } else {
                        state.capturedPhotos[config.count - 1] = photoData;
                    }
                    renderFrameSlots();
                    updatePhotoBadges();
                    showToast("อัปโหลดรูปสำเร็จ");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateCaption() {
            const text = document.getElementById('captionInput').value;
            const showDate = document.getElementById('showDateToggle').checked;
            
            document.getElementById('frameCaptionDisplay').innerText = text;
            
            const dateDisp = document.getElementById('frameDateDisplay');
            if (showDate) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                dateDisp.innerText = `${yyyy}.${mm}.${dd}`;
                dateDisp.style.display = 'block';
            } else {
                dateDisp.style.display = 'none';
            }
        }

        function addSticker(emoji) {
            const container = document.getElementById('stickersContainer');
            const sticker = document.createElement('div');
            sticker.className = 'sticker-item absolute text-2xl select-none';
            sticker.innerText = emoji;
            sticker.style.left = '40%';
            sticker.style.top = '40%';

            let isDragging = false;
            let currentX, currentY, initialX, initialY;

            function dragStart(e) {
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                initialX = clientX - sticker.offsetLeft;
                initialY = clientY - sticker.offsetTop;
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                currentX = clientX - initialX;
                currentY = clientY - initialY;
                sticker.style.left = `${currentX}px`;
                sticker.style.top = `${currentY}px`;
            }

            function dragEnd() { isDragging = false; }

            sticker.addEventListener('mousedown', dragStart);
            sticker.addEventListener('touchstart', dragStart, { passive: false });
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, { passive: false });
            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('touchend', dragEnd);

            container.appendChild(sticker);
        }

        function clearStickers() {
            document.getElementById('stickersContainer').innerHTML = '';
            showToast("ล้างสติกเกอร์แล้ว");
        }

        function resetApp() {
            state.capturedPhotos = [];
            clearStickers();
            renderFrameSlots();
            updatePhotoBadges();
            showToast("รีเซ็ตระบบเรียบร้อย");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        async function downloadImage() {
            showToast("กำลังประมวลผลรูปภาพ...");
            const frame = document.getElementById('photoboothFrame');

            try {
                if (!window.html2canvas) {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    document.head.appendChild(script);
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                    });
                }

                // ใช้ขนาดจริงของกรอบบนหน้าจอ และเพิ่มความละเอียด 4 เท่า
                // ไม่กำหนด width/height ใหม่ จึงรักษาสัดส่วนของกรอบเดิม
                const rect = frame.getBoundingClientRect();
                const exportScale = 4;

                const canvas = await html2canvas(frame, {
                    scale: exportScale,
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: null,
                    imageTimeout: 15000,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `Haru-Photobooth-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);

                document.body.appendChild(link);
                link.click();
                link.remove();

                showToast(`บันทึกรูปภาพเรียบร้อย (${canvas.width} × ${canvas.height}px)`);
            } catch (err) {
                console.error("Export Error:", err);
                showToast("ไม่สามารถดาวน์โหลดได้");
            }
        }

        function printPhoto() {
            window.print();
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            setLayout('4-strip');
            applyTheme('pink-ribbon');
            updateCaption();
        });
    </script>
</body>
</html>
